name: retail-j2

services:
  hdfs:
    build: ./hadoop
    image: retail-j2-hadoop:3.5.0
    hostname: hdfs
    entrypoint: ["/bin/bash", "-c", "exec sleep infinity"]
    environment:
      HADOOP_HEAPSIZE_MAX: "320"
    volumes:
      - namenode:/opt/hadoop/retail-j2-namenode
      - datanode:/opt/hadoop/retail-j2-datanode
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "127.0.0.1:9870:9870"

  nifi:
    image: apache/nifi:2.12.0@sha256:6f7f2840dbf178c6dd3fa13435b9b358f3be3c6fb7417de467a35a267f4d28ad
    environment:
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "localhost:8443,127.0.0.1:8443"
      NIFI_JVM_HEAP_INIT: "384m"
      NIFI_JVM_HEAP_MAX: "768m"
    volumes:
      - ./hadoop/core-site.xml:/etc/retail-j2/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/etc/retail-j2/hadoop/hdfs-site.xml:ro
      - "${LOCALAPPDATA}/RetailIngestionJ2/nar/nifi-hadoop-nar-2.12.0.nar:/opt/nifi/nifi-current/lib/nifi-hadoop-nar-2.12.0.nar:ro"
      - "${LOCALAPPDATA}/RetailIngestionJ2/nar/nifi-hadoop-libraries-nar-2.12.0.nar:/opt/nifi/nifi-current/lib/nifi-hadoop-libraries-nar-2.12.0.nar:ro"
    ports:
      - "127.0.0.1:8443:8443"

volumes:
  namenode:
  datanode:
